<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Ticketing Prototype</title>
<style>
/* ============ Design tokens ============ */
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#161a23; --muted:#6a7280; --line:#e5e7ee;
  --brand:#4f46e5; --brand-ink:#ffffff; --soft:#eef0ff; --danger:#dc2626;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --c-locked:#94a3b8; --c-open:#2563eb; --c-in-progress:#7c3aed; --c-in-review:#d97706;
  --c-rework:#dc2626; --c-on-hold:#64748b; --c-closed:#16a34a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1218;--card:#171b24;--ink:#e8ebf2;--muted:#98a1b3;--line:#262c39;--soft:#1e2342;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
small,.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}

/* ============ Layout ============ */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:17px;padding:4px 10px 16px;display:flex;gap:8px;align-items:center}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--brand);display:inline-block}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--soft);color:var(--brand)}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-closed);margin-right:6px}
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:12px 28px;flex-wrap:wrap}
.top .grow{flex:1}
.top label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.page{padding:24px 28px 60px;max-width:1280px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted)}

/* ============ Controls ============ */
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--brand-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
textarea{resize:vertical;min-height:70px}
select{width:auto;min-width:140px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}

/* ============ Cards, stats, tables ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card+.card,.stack>*+*{margin-top:16px}
.card h3{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--brand)}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:26px;line-height:1}
.stat.bad b{color:var(--danger)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols>.card{margin-top:0}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
td small{display:block}
.empty{padding:22px;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .3s}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.phase{border:1px solid var(--line);border-radius:12px;padding:12px}
.phase b{display:block;font-size:12px;margin-bottom:2px}
.phase small{display:block;margin-bottom:8px}
.group-title{margin:22px 0 8px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

/* ============ Chips ============ */
.chip{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.s-locked{--c:var(--c-locked)} .s-open{--c:var(--c-open)} .s-in-progress{--c:var(--c-in-progress)}
.s-in-review{--c:var(--c-in-review)} .s-rework{--c:var(--c-rework)} .s-on-hold{--c:var(--c-on-hold)}
.s-closed{--c:var(--c-closed)} .s-overdue{--c:var(--c-rework)}
.chip.stage{--c:var(--c-open)}
.late{color:var(--danger);font-weight:600}

/* ============ Drawer ============ */
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.42);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{padding:18px 22px;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
.drawer-body{padding:20px 22px 40px;overflow:auto;flex:1}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.meta dt{font-size:12px;color:var(--muted)} .meta dd{margin:2px 0 0;font-weight:500}
.banner{border-radius:12px;padding:12px 14px;margin-top:14px;border:1px solid var(--line);background:var(--card)}
.banner.warn{border-color:color-mix(in srgb,var(--c-in-review) 50%,var(--line));background:color-mix(in srgb,var(--c-in-review) 9%,var(--card))}
.banner.bad{border-color:color-mix(in srgb,var(--danger) 50%,var(--line));background:color-mix(in srgb,var(--danger) 8%,var(--card))}
.banner.info{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));background:var(--soft)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sect{margin-top:22px}
.sect>h3{margin-bottom:10px}
.attach{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.attach:last-child{border:0}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:auto}
.log{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.log:last-child{border:0}
.av{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.log.system{color:var(--muted);font-size:12.5px}
.log.system .av{background:var(--line);color:var(--muted)}
.log.return .txt{border-left:3px solid var(--danger);padding-left:10px}
.note{margin-top:4px;color:var(--danger);font-size:12px}

/* ============ Bell, toasts, dialog ============ */
.bell{position:relative}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
.panel{position:absolute;right:28px;top:56px;width:360px;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 18px 50px rgba(0,0,0,.2);z-index:30;padding:8px}
.panel .it{padding:10px;border-radius:10px;cursor:pointer}
.panel .it:hover{background:var(--bg)}
.panel .it.unread{background:var(--soft)}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:#161a23;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:80vw}
.toast.error{background:#b91c1c}
dialog{border:0;border-radius:16px;padding:22px;width:min(460px,92vw);background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,25,.45)}
dialog h3{margin-bottom:14px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:4px 8px}.side-foot{display:none}
  .page,.top{padding-left:16px;padding-right:16px}
  .grid2,.grid3,.meta{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="modal"></dialog>
<div id="toasts"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
(function(){
'use strict';

/*ENGINE-START*/
/* =====================================================================
   ENGINE: the 22 predefined tickets, the rules, and every action.
   No DOM code in this block, so it can be reused for a real back end.
   ===================================================================== */
const ROLES = {seo:'SEO', writer:'Content Writer', qc:'Content QC', designer:'Designer', developer:'Developer', incharge:'Incharge'};
const PHASES = ['Setup and Planning','Frameworks','Production','Quality Checks','Development','Launch'];
const STATUSES = ['Locked','Open','In Progress','In Review','Rework','On Hold','Closed'];
const ACTIVE = ['Open','In Progress','Rework'];
const PAGE_STAGES = {content:['Writing','Content QC','SEO QC','Approved'], design:['Designing','Design QC','Approved']};

const TEMPLATES = [
 {id:'T01',title:'Project Setup',phase:1,from:'seo',to:'incharge',kind:'task',opens:[],
  task:'Confirm the team and set a deadline on every ticket. Use "Auto-set deadlines" to spread the dates from today to the project deadline, then adjust any ticket.'},
 {id:'T02',title:'Initial SEO Plan',phase:1,from:'seo',to:'writer',kind:'work',opens:['T01'],
  task:'Use the page list, URLs, content suggestions, keywords and the reference sheet to build the content framework for every page type. Attach the reference sheet before you submit.'},
 {id:'T03',title:'Content Framework QC',phase:2,from:'writer',to:'seo',kind:'review',reviews:'T02',
  task:'Review the content frameworks for home, services, sectors, blogs, contact, about, locations, terms, privacy and other pages. Approve, or return with a reason.'},
 {id:'T04',title:'Design Framework',phase:2,from:'seo',to:'designer',kind:'work',opens:['T03'],
  task:'Build the page design frameworks from the approved content framework.'},
 {id:'T05',title:'Design Framework QC',phase:2,from:'designer',to:'seo',kind:'review',reviews:'T04',
  task:'Check the design framework against the content framework and the SEO needs.'},
 {id:'T06',title:'Design Framework Approval',phase:2,from:'designer',to:'writer',kind:'review',reviews:'T04',
  task:'Confirm that the design follows the content framework.'},
 {id:'T07',title:'Content Writing',phase:3,from:'seo',to:'writer',kind:'pages',opens:['T05','T06'],
  task:'Write the full content of every page in Google Docs. Submit each page for Content QC as soon as it is done. The ticket closes when every page has been submitted.'},
 {id:'T08',title:'Page Design',phase:3,from:'seo',to:'designer',kind:'pages',opens:['T05','T06'],
  task:'Design every page from the approved design framework. Submit each page for the final design check as soon as it is done.'},
 {id:'T09',title:'Image Assets',phase:3,from:'seo',to:'designer',kind:'work',opens:['T05','T06'],
  task:'Create all images and visual assets the pages need. Attach links to the files, then submit.'},
 {id:'T10',title:'Image QC',phase:3,from:'designer',to:'seo',kind:'review',reviews:'T09',
  task:'Check that the images are relevant, clear, optimised and meet the project needs.'},
 {id:'T11',title:'Content QC',phase:4,from:'writer',to:'qc',kind:'pageqc',
  task:'Check grammar, readability, accuracy, repetition and overall quality, page by page. A passed page moves to SEO QC. A returned page goes back to the writer.'},
 {id:'T12',title:'Content SEO QC',phase:4,from:'qc',to:'seo',kind:'pageqc',
  task:'Check keywords, headings, internal links and search intent, page by page. A passed page is approved for the developer.'},
 {id:'T13',title:'Final Design QC',phase:4,from:'designer',to:'seo',kind:'pageqc',
  task:'Do the final check of every page design, page by page.'},
 {id:'T14',title:'Developer Handover',phase:5,from:'seo',to:'developer',kind:'gate',opens:['T10','T12','T13'],
  task:'Confirm that the approved content, final designs and images are complete. Accept the handover, or return it and list what is missing.'},
 {id:'T15',title:'Build Home Page',phase:5,from:'seo',to:'developer',kind:'work',opens:['T14'],
  task:'Build the home page from the approved design, content and images, then submit it for the SEO check.'},
 {id:'T16',title:'Home Page QC',phase:5,from:'developer',to:'seo',kind:'review',reviews:'T15',
  task:'Check the built home page against the SEO requirements.'},
 {id:'T17',title:'Build Remaining Pages',phase:5,from:'seo',to:'developer',kind:'devpages',opens:['T16'],
  task:'Build all other pages one by one and add the approved content to each. Tick the website settings when they are configured, then submit.'},
 {id:'T18',title:'Final SEO Check',phase:5,from:'developer',to:'seo',kind:'review',reviews:'T17',onReturn:'T19',
  task:'Check all pages, URLs, headings, metadata, internal links, images and indexing settings. If anything is wrong, return it: this opens T19 for the developer.'},
 {id:'T19',title:'Final SEO Correction',phase:5,from:'seo',to:'developer',kind:'fix',conditional:true,
  task:'Fix the issues found in the final SEO check, then complete this ticket to send the work back to T18.'},
 {id:'T20',title:'Pre-Launch Check',phase:6,from:'seo',to:'incharge',kind:'gate',opens:['T18'],
  checklist:['WordPress search engine visibility is not set to discourage indexing','robots.txt does not block important pages','Website is ready for crawling and indexing','All required approvals are received'],
  task:'Review the SEO launch checklist and approve go-live. Every item must be ticked before you can approve.'},
 {id:'T21',title:'Go Live',phase:6,from:'incharge',to:'developer',kind:'work',opens:['T20'],
  task:'Publish the website, then submit it for post-launch verification.'},
 {id:'T22',title:'Post-Launch Verification',phase:6,from:'developer',to:'seo',kind:'review',reviews:'T21',
  task:'Check that the live website works and that search engines can reach the pages meant for indexing.'}
];

const PAGE_FLOW = {
 T07:{field:'content',first:'Writing',next:'Content QC',nextTicket:'T11'},
 T08:{field:'design',first:'Designing',next:'Design QC',nextTicket:'T13'},
 T11:{field:'content',stage:'Content QC',pass:'SEO QC',back:'Writing',backTicket:'T07',done:['SEO QC','Approved'],passTicket:'T12'},
 T12:{field:'content',stage:'SEO QC',pass:'Approved',back:'Writing',backTicket:'T07',done:['Approved']},
 T13:{field:'design',stage:'Design QC',pass:'Approved',back:'Designing',backTicket:'T08',done:['Approved']}
};
const DEFAULT_PAGES = [['Home','/'],['Services','/services'],['Sectors','/sectors'],['Blogs','/blog'],['Contact','/contact'],['About','/about'],['Locations','/locations'],['Terms','/terms'],['Privacy','/privacy'],['Others','/others']];

/* ---------- small helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO = () => isoOf(new Date());
const addDays = (iso,n) => { const a=iso.split('-').map(Number); return isoOf(new Date(a[0],a[1]-1,a[2]+n)); };
const daysBetween = (a,b) => { const x=a.split('-').map(Number), y=b.split('-').map(Number); return Math.round((new Date(y[0],y[1]-1,y[2])-new Date(x[0],x[1]-1,x[2]))/86400000); };
const tpl = id => TEMPLATES.find(x => x.id===id);
const ticket = (p,id) => p.tickets.find(x => x.id===id);
const list = s => String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const check = (c,m) => { if(!c) throw new Error(m); };
const newPage = (name,url) => ({id:uid(),name:String(name).trim(),url:String(url||'').trim(),home:String(name).trim().toLowerCase()==='home',content:'Writing',design:'Designing',dev:'Todo',note:''});
const members = p => [...new Set(Object.keys(ROLES).flatMap(k => p.roles[k]))];
const rolesOf = (p,name) => Object.keys(ROLES).filter(k => p.roles[k].includes(name));
const isOverdue = t => !!t.due && t.due < todayISO() && !['Closed','Locked'].includes(t.status);
const entry = (t,who,text,type) => { t.log.push({id:uid(),who:who,text:text,type:type||'system',at:Date.now()}); };
const notify = (p,names,text,tid) => { [...new Set(names)].forEach(n => p.notifications.push({id:uid(),to:n,text:text,tid:tid,at:Date.now(),read:false})); };

function lockedReason(t){
  const tp = tpl(t.id);
  if(tp.opens && tp.opens.length) return 'Opens after '+tp.opens.join(' and ')+' '+(tp.opens.length>1?'are':'is')+' closed.';
  if(tp.reviews) return 'Opens when '+tp.reviews+' is submitted for review.';
  if(tp.kind==='pageqc') return 'Opens when a page is submitted for this check.';
  if(t.id==='T19') return 'Opens only if T18 finds issues.';
  return 'Waiting for the ticket before it.';
}

function createProject(f){
  const name = String(f.name||'').trim();
  check(name,'Enter a project name.');
  check(f.deadline,'Choose a deadline.');
  const roles = {};
  Object.keys(ROLES).forEach(k => { roles[k] = list(f[k]); check(roles[k].length,'Enter a name for '+ROLES[k]+'.'); });
  const p = {id:uid(),name:name,roles:roles,deadline:f.deadline,created:todayISO(),status:'Active',notifications:[],
    pages:DEFAULT_PAGES.map(x => newPage(x[0],x[1])),
    tickets:TEMPLATES.map(tp => ({id:tp.id,status:'Locked',assignee:roles[tp.to].slice(),due:'',priority:'Medium',log:[],attachments:[],hold:null,delayReason:'',flags:{},returns:0,
      checklist:tp.checklist?tp.checklist.map(l=>({label:l,done:false})):null}))};
  const first = ticket(p,'T01');
  setStatus(p,first,'Open','System','project created');
  notify(p,first.assignee,'T01 Project Setup is open: confirm the team and set deadlines.','T01');
  return p;
}

function setStatus(p,t,s,who,extra){
  const old = t.status; if(old===s) return;
  t.status = s; const now = Date.now();
  if(s==='Open' && !t.openedAt) t.openedAt = now;
  if(s==='In Progress' && !t.startedAt) t.startedAt = now;
  if(s==='Closed') t.closedAt = now;
  if(s!=='Closed' && old==='Closed') t.closedAt = null;
  entry(t,who||'System',old+' to '+s+(extra?' ('+extra+')':''),'system');
}
function openTicket(p,t,why){
  setStatus(p,t,'Open','System',why);
  const tp = tpl(t.id);
  notify(p,t.assignee,t.id+' '+tp.title+' is open for you.',t.id);
}

/* Unlock tickets whose predecessors are closed, and derive the page-level ticket states. */
function refresh(p){
  let changed = true, guard = 0;
  while(changed && guard++ < 30){
    changed = false;
    for(const t of p.tickets){
      const tp = tpl(t.id);
      if(t.status==='Locked' && tp.opens && tp.opens.length && tp.opens.every(id => ticket(p,id).status==='Closed')){
        openTicket(p,t,'previous tickets approved'); changed = true;
      }
    }
    for(const t of p.tickets){
      const tp = tpl(t.id), cfg = PAGE_FLOW[t.id];
      if(!cfg || t.status==='On Hold') continue;
      if(tp.kind==='pages'){
        if(t.status==='Locked') continue;
        const all = p.pages.length>0 && p.pages.every(g => g[cfg.field]!==cfg.first);
        const any = p.pages.some(g => g[cfg.field]!==cfg.first);
        if(all){ if(t.status!=='Closed'){ setStatus(p,t,'Closed','System','every page submitted'); changed = true; } }
        else if(t.status==='Closed'){ setStatus(p,t,'Rework','System','a page was returned'); changed = true; }
        else if(any && t.status==='Open'){ setStatus(p,t,'In Progress','System'); changed = true; }
      } else if(tp.kind==='pageqc'){
        const waiting = p.pages.some(g => g[cfg.field]===cfg.stage);
        const all = p.pages.length>0 && p.pages.every(g => cfg.done.includes(g[cfg.field]));
        const next = all ? 'Closed' : waiting ? 'Open' : 'Locked';
        if(next==='Open' && (t.status==='Open' || t.status==='In Progress')) continue;
        if(t.status!==next){
          if(next==='Open') openTicket(p,t,'a page is waiting'); else setStatus(p,t,next,'System',next==='Closed'?'every page checked':'waiting for the next page');
          changed = true;
        }
      }
    }
  }
}

function autoDeadlines(p,who){
  check(p.roles.incharge.includes(who),'Only the Incharge can change deadlines.');
  const start = todayISO(); const span = daysBetween(start,p.deadline);
  check(span>=p.tickets.length,'The project deadline is too close. Choose a later deadline.');
  p.tickets.forEach((t,i) => { t.due = addDays(start,Math.round((i+1)/p.tickets.length*span)); });
  p.tickets.forEach(t => { if(t.id==='T01') entry(t,who,'Deadlines were set on all tickets.','system'); });
}

/* The one place every change goes through. */
function act(p,who,tid,name,d){
  d = d || {};
  const t = tid ? ticket(p,tid) : null, tp = t ? tpl(tid) : null;
  const isA = !!t && t.assignee.includes(who);
  const inch = p.roles.incharge.includes(who);
  const raiser = !!tp && p.roles[tp.from].includes(who);
  const isMember = members(p).includes(who);
  switch(name){
    case 'start':
      check(isA,'Only the assignee can start this ticket.');
      check(['Open','Rework'].includes(t.status),'This ticket cannot be started now.');
      setStatus(p,t,'In Progress',who); break;
    case 'submit': {
      check(isA,'Only the assignee can submit this ticket.');
      check(ACTIVE.includes(t.status),'This ticket cannot be submitted now.');
      check(['work','devpages'].includes(tp.kind),'This ticket is not submitted as a whole.');
      if(t.id==='T02'){ check(t.attachments.length>0,'Attach the reference sheet before submitting.'); check(p.pages.length>0,'Add at least one page to the page list.'); }
      if(t.id==='T17'){ check(p.pages.filter(g=>!g.home).every(g=>g.dev==='Built'),'Mark every remaining page as built first.'); check(t.flags.settings,'Tick that the website settings are configured.'); }
      setStatus(p,t,'In Review',who,'submitted');
      if(d.comment) entry(t,who,d.comment,'comment');
      p.tickets.filter(x => tpl(x.id).reviews===t.id).forEach(r => { openTicket(p,r,t.id+' submitted for review'); });
      break; }
    case 'approve': {
      check(isA,'Only the assignee can approve this ticket.');
      check(['review','gate'].includes(tp.kind),'There is nothing to approve here.');
      check(['Open','In Progress'].includes(t.status),'This ticket is not waiting for a decision.');
      if(t.checklist) check(t.checklist.every(c=>c.done),'Tick every checklist item before approving.');
      entry(t,who,'Approved'+(d.comment?': '+d.comment:''),'approve');
      setStatus(p,t,'Closed',who,'approved');
      if(tp.kind==='review'){
        const w = ticket(p,tp.reviews);
        const sibs = p.tickets.filter(x => tpl(x.id).reviews===w.id);
        if(sibs.every(x => x.status==='Closed')){
          setStatus(p,w,'Closed','System','all reviews approved');
          notify(p,w.assignee,w.id+' '+tpl(w.id).title+' was approved.',w.id);
        }
      }
      if(t.id==='T22'){ p.status = 'Launched'; }
      break; }
    case 'return': {
      check(isA,'Only the assignee can return this ticket.');
      check(['review','gate'].includes(tp.kind),'There is nothing to return here.');
      check(['Open','In Progress'].includes(t.status),'This ticket is not waiting for a decision.');
      const reason = String(d.reason||'').trim(); check(reason,'Write a reason for the return.');
      entry(t,who,reason,'return'); t.returns = (t.returns||0)+1;
      if(tp.kind==='gate'){
        setStatus(p,t,'Rework',who,'returned');
        notify(p,p.roles[tp.from],t.id+' was returned: '+reason,t.id);
      } else if(tp.onReturn){
        setStatus(p,t,'Rework',who,'waiting for '+tp.onReturn);
        const f = ticket(p,tp.onReturn); entry(f,who,reason,'return');
        openTicket(p,f,'issues found in '+t.id);
      } else {
        const w = ticket(p,tp.reviews);
        p.tickets.filter(x => tpl(x.id).reviews===w.id).forEach(r => setStatus(p,r,'Locked',who,r.id===t.id?'returned':'sent back with '+t.id));
        entry(w,who,reason,'return'); w.returns = (w.returns||0)+1;
        setStatus(p,w,'Rework',who,'returned by '+t.id);
        notify(p,w.assignee,w.id+' was returned: '+reason,w.id);
      }
      break; }
    case 'resubmit':
      check(raiser||inch,'Only the person who raised this ticket can resubmit it.');
      check(tp.kind==='gate' && t.status==='Rework','This ticket was not returned.');
      setStatus(p,t,'Open',who,'resubmitted');
      notify(p,t.assignee,t.id+' '+tp.title+' was resubmitted.',t.id); break;
    case 'complete':
      check(isA,'Only the assignee can complete this ticket.');
      check(['task','fix'].includes(tp.kind),'This ticket is not completed this way.');
      check(ACTIVE.includes(t.status),'This ticket cannot be completed now.');
      if(t.id==='T01') check(p.tickets.every(x=>x.due),'Set a deadline on every ticket first. Use Auto-set deadlines.');
      setStatus(p,t,'Closed',who,'completed');
      if(t.id==='T19'){ const r = ticket(p,'T18'); openTicket(p,r,'fixes done'); }
      break;
    case 'hold': {
      check(isA||inch,'Only the assignee or the Incharge can hold this ticket.');
      check(ACTIVE.includes(t.status),'This ticket cannot be put on hold now.');
      const reason = String(d.reason||'').trim(); check(reason,'Write the reason for the hold.'); check(d.until,'Give the expected date.');
      t.hold = {reason:reason,until:d.until,prev:t.status};
      entry(t,who,'On hold until '+d.until+': '+reason,'comment');
      setStatus(p,t,'On Hold',who);
      notify(p,p.roles.incharge,t.id+' is on hold: '+reason,t.id); break; }
    case 'resume':
      check(isA||inch,'Only the assignee or the Incharge can resume this ticket.');
      check(t.status==='On Hold','This ticket is not on hold.');
      setStatus(p,t,t.hold.prev,who,'resumed'); t.hold = null; break;
    case 'reassign': {
      check(isA||inch,'Only the assignee or the Incharge can reassign this ticket.');
      check(t.status!=='Closed','A closed ticket cannot be reassigned.');
      check(members(p).includes(d.to),'Choose a team member.');
      check(String(d.comment||'').trim(),'A comment is required to reassign.');
      const old = t.assignee.join(', ');
      t.assignee = [d.to];
      entry(t,who,'Reassigned from '+old+' to '+d.to+': '+d.comment,'comment');
      notify(p,[d.to],t.id+' '+tp.title+' was assigned to you.',t.id); break; }
    case 'setDue':
      check(inch,'Only the Incharge can change deadlines.');
      check(/^\d{4}-\d{2}-\d{2}$/.test(d.date||''),'Choose a valid date.');
      if(t.due) check(String(d.comment||'').trim(),'A comment is required to change a deadline.');
      entry(t,who,'Due date '+(t.due?'changed from '+t.due+' to ':'set to ')+d.date+(d.comment?': '+d.comment:''),'system');
      t.due = d.date; break;
    case 'setPriority':
      check(inch,'Only the Incharge can change the priority.');
      check(['Low','Medium','High'].includes(d.priority),'Choose a priority.');
      entry(t,who,'Priority set to '+d.priority,'system'); t.priority = d.priority; break;
    case 'reopen':
      check(inch,'Only the Incharge can reopen a closed ticket.');
      check(t.status==='Closed','Only a closed ticket can be reopened.');
      check(String(d.reason||'').trim(),'Write a reason to reopen.');
      entry(t,who,'Reopened: '+d.reason,'comment');
      setStatus(p,t,'Open',who,'reopened'); break;
    case 'comment':
      check(isMember,'Only team members can comment.');
      check(String(d.text||'').trim(),'Write a comment first.');
      entry(t,who,String(d.text).trim(),'comment');
      notify(p,t.assignee.filter(n=>n!==who),who+' commented on '+t.id,t.id); break;
    case 'attach':
      check(isMember,'Only team members can attach files.');
      check(String(d.name||'').trim(),'Give the attachment a name.');
      t.attachments.push({id:uid(),name:String(d.name).trim(),url:String(d.url||'').trim(),who:who,at:Date.now()});
      entry(t,who,'Attached '+String(d.name).trim(),'system'); break;
    case 'detach':
      t.attachments = t.attachments.filter(a => a.id!==d.id); break;
    case 'checklist':
      check(isMember,'Only team members can tick the checklist.');
      check(t.status!=='Closed','This ticket is closed.');
      t.checklist[d.index].done = !t.checklist[d.index].done; break;
    case 'settings':
      check(isA,'Only the assignee can tick this.');
      t.flags.settings = !t.flags.settings; break;
    case 'delay':
      check(isA||inch,'Only the assignee or the Incharge can add a delay reason.');
      t.delayReason = String(d.text||'').trim(); break;
    case 'pageSubmit': {
      const cfg = PAGE_FLOW[tid]; check(cfg && tp.kind==='pages','This ticket has no pages to submit.');
      check(isA,'Only the assignee can submit pages.');
      check(ACTIVE.includes(t.status),'This ticket is not open for work.');
      const pg = p.pages.find(g => g.id===d.pageId); check(pg && pg[cfg.field]===cfg.first,'This page was already submitted.');
      pg[cfg.field] = cfg.next; pg.note = '';
      entry(t,who,'Submitted page '+pg.name+' for '+(cfg.next),'submit');
      notify(p,ticket(p,cfg.nextTicket).assignee,'Page '+pg.name+' is ready for '+cfg.next+'.',cfg.nextTicket); break; }
    case 'pagePass':
    case 'pageReturn': {
      const cfg = PAGE_FLOW[tid]; check(cfg && tp.kind==='pageqc','This ticket has no page checks.');
      check(isA,'Only the assignee can check pages.');
      check(['Open','In Progress'].includes(t.status),'No page is waiting for this check.');
      const pg = p.pages.find(g => g.id===d.pageId); check(pg && pg[cfg.field]===cfg.stage,'This page is not waiting for this check.');
      if(name==='pagePass'){
        pg[cfg.field] = cfg.pass; entry(t,who,'Passed page '+pg.name,'approve');
        if(cfg.passTicket) notify(p,ticket(p,cfg.passTicket).assignee,'Page '+pg.name+' is ready for SEO QC.',cfg.passTicket);
      } else {
        const reason = String(d.reason||'').trim(); check(reason,'Write a reason for the return.');
        pg[cfg.field] = cfg.back; pg.note = reason;
        entry(t,who,'Returned page '+pg.name+': '+reason,'return'); t.returns = (t.returns||0)+1;
        const bt = ticket(p,cfg.backTicket); entry(bt,who,'Page '+pg.name+' returned by '+t.id+': '+reason,'return'); bt.returns = (bt.returns||0)+1;
        notify(p,bt.assignee,'Page '+pg.name+' was returned: '+reason,bt.id);
      }
      break; }
    case 'devPage': {
      check(t && t.id==='T17','Pages are built in T17.'); check(isA,'Only the assignee can mark pages.');
      check(ACTIVE.includes(t.status),'This ticket is not open for work.');
      const pg = p.pages.find(g => g.id===d.pageId); check(pg && !pg.home,'Page not found.');
      pg.dev = pg.dev==='Built' ? 'Todo' : 'Built';
      if(t.status==='Open') setStatus(p,t,'In Progress',who);
      entry(t,who,(pg.dev==='Built'?'Built page ':'Reopened page ')+pg.name,'system'); break; }
    case 'addPage':
      check(isMember,'Only team members can edit the page list.');
      check(String(d.name||'').trim(),'Give the page a name.');
      p.pages.push(newPage(d.name,d.url)); break;
    case 'removePage':
      check(isMember,'Only team members can edit the page list.');
      p.pages = p.pages.filter(g => g.id!==d.pageId); break;
    case 'editPage': {
      check(isMember,'Only team members can edit the page list.');
      const pg = p.pages.find(g => g.id===d.pageId); check(pg,'Page not found.');
      if(d.field==='name'){ check(String(d.value).trim(),'A page needs a name.'); pg.name = String(d.value).trim(); pg.home = pg.name.toLowerCase()==='home'; }
      if(d.field==='url') pg.url = String(d.value).trim();
      break; }
    case 'autoDeadlines': autoDeadlines(p,who); break;
    default: throw new Error('Unknown action: '+name);
  }
  refresh(p);
}

function progress(p){
  const counted = p.tickets.filter(t => !(t.id==='T19' && t.status==='Locked'));
  const closed = counted.filter(t => t.status==='Closed').length;
  let phase = 6;
  for(let i=1;i<=6;i++){ if(counted.some(t => tpl(t.id).phase===i && t.status!=='Closed')){ phase = i; break; } }
  return {closed:closed,total:counted.length,pct:Math.round(closed/counted.length*100),phase:phase};
}

const KEY = 'pipeline-prototype-v1';

const slug = s => s.toLowerCase().replace(/\s+/g,'-');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = iso => { if(!iso) return 'Not set'; const a=iso.split('-'); return Number(a[2])+' '+MONTHS[Number(a[1])-1]; };
const fmtTime = ms => new Date(ms).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

const stageChip = s => '<span class="chip stage '+(['Approved','Built'].includes(s)?'s-closed':'')+'">'+esc(s)+'</span>';

let data = load();

  return p;
}
function seed(){ const p = sampleProject(); return {projects:[p],projectId:p.id,viewer:'Suresh'}; }
function load(){

  return seed();
}
function cur(){ return data.projects.find(p => p.id===data.projectId) || data.projects[0] || null; }
function fixViewer(p){ if(p && !members(p).includes(data.viewer)) data.viewer = p.roles.incharge[0]; }

/* ---------- persistence: browser storage always, a real file when linked ---------- */
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(data)); lastSaved = new Date(); }
  catch(e){ toast('Could not save in this browser: '+e.message,'error'); }
  writeFile().catch(e => toast('File save failed: '+e.message,'error'));
  updateSaved();
}
async function writeFile(){
  if(!fileHandle) return;
  const w = await fileHandle.createWritable(); await w.write(JSON.stringify(data,null,2)); await w.close();
}
function updateSaved(){
  const el = $('#savedNote'); if(!el) return;
  el.innerHTML = '<span class="dot"></span>'+(lastSaved?'Saved '+lastSaved.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'Saved in this browser')+(fileHandle?'<br>and to your data file':'');
}
function download(name,text,type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:type})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- toast and modal ---------- */
function toast(msg,kind){
  const el = document.createElement('div'); el.className = 'toast '+(kind||''); el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(),3600);
}
function ask(title,fields,submitLabel,cb){
  const m = $('#modal');
  const f = fields.map(x => {
    let input;
    if(x.type==='textarea') input = '<textarea name="'+x.name+'" '+(x.required?'required':'')+' placeholder="'+esc(x.placeholder||'')+'"></textarea>';
    else if(x.type==='select') input = '<select name="'+x.name+'" style="width:100%">'+x.options.map(o => '<option>'+esc(o)+'</option>').join('')+'</select>';
    else input = '<input name="'+x.name+'" type="'+(x.type||'text')+'" '+(x.required?'required':'')+' value="'+esc(x.value||'')+'">';
    return '<label class="field"><span>'+esc(x.label)+'</span>'+input+'</label>';
  }).join('');
  m.innerHTML = '<form><h3>'+esc(title)+'</h3>'+f+'<div class="row end"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">'+esc(submitLabel)+'</button></div></form>';
  const form = m.querySelector('form');
  form.addEventListener('submit',e => { e.preventDefault(); const v = Object.fromEntries(new FormData(form)); m.close(); cb(v); });
  m.querySelector('[data-close]').addEventListener('click',() => m.close());
  m.showModal(); const first = m.querySelector('input,textarea,select'); if(first) first.focus();
}

/* ---------- run an action, save, redraw ---------- */
function run(name,tid,d){
  const p = cur();
  try{ act(p,data.viewer,tid,name,d||{}); save(); render(); }
  catch(e){ toast(e.message,'error'); }
}

/* ---------- permission-aware buttons for a ticket ---------- */
function buttonsFor(p,t,who){
  const tp = tpl(t.id), b = [], st = t.status;
  const mine = t.assignee.includes(who), inch = p.roles.incharge.includes(who), raiser = p.roles[tp.from].includes(who);
  if(mine && ACTIVE.includes(st)){
    if(['work','devpages'].includes(tp.kind)){ if(st!=='In Progress') b.push({a:'start',l:'Start work'}); b.push({a:'submit',l:'Submit for review',c:'primary'}); }
    if(['task','fix'].includes(tp.kind)) b.push({a:'complete',l:tp.kind==='fix'?'Complete and send to T18':'Confirm and close',c:'primary'});
  }
  if(mine && ['Open','In Progress'].includes(st) && ['review','gate'].includes(tp.kind)){
    b.push({a:'approve',l:tp.id==='T14'||t.id==='T14'?'Accept handover':(t.id==='T20'?'Approve go-live':'Approve'),c:'primary'});
    b.push({a:'return',l:'Return with reason',c:'danger'});
  }
  if(tp.kind==='gate' && st==='Rework' && (raiser||inch)) b.push({a:'resubmit',l:'Resubmit',c:'primary'});
  if((mine||inch) && ACTIVE.includes(st)) b.push({a:'hold',l:'Put on hold'});
  if((mine||inch) && st==='On Hold') b.push({a:'resume',l:'Resume',c:'primary'});
  if((mine||inch) && !['Closed'].includes(st)) b.push({a:'reassign',l:'Reassign'});
  if(inch && st==='Closed') b.push({a:'reopen',l:'Reopen'});
  return b;
}

    +'<div class="cols"><div class="card"><h3>My tickets <small>'+esc(me)+'</small></h3>'+(mine.length?'<table><tr><th>Ticket</th><th>Assigned</th><th>Due</th><th>Status</th></tr>'+mine.map(row).join('')+'</table>':'<div class="empty">Nothing waiting for you.</div>')+'</div>'
    +'<div class="card"><h3>Pending and overdue</h3>'+(pend.length?'<table><tr><th>Ticket</th><th>Person</th><th>Due</th><th>Reason</th></tr>'+pend.map(t => '<tr class="click" data-act="open" data-tid="'+t.id+'"><td><b>'+t.id+'</b><small>'+chip(t.status)+'</small></td><td>'+names(t.assignee)+'</td><td class="'+(isOverdue(t)?'late':'')+'">'+fmtDate(t.due)+(isOverdue(t)?'<small class="late">'+daysBetween(t.due,todayISO())+' days late</small>':'')+'</td><td>'+(t.hold?esc(t.hold.reason):(t.delayReason?esc(t.delayReason):'<span class="late">No reason yet</span>'))+'</td></tr>').join('')+'</table>':'<div class="empty">No delays. Nice.</div>')+'</div></div>'
    +'<div class="card" style="margin-top:16px"><h3>Who has what</h3><table><tr><th>Person</th><th>Role</th><th>Working on</th></tr>'+who.map(w => '<tr><td><b>'+esc(w.n)+'</b></td><td>'+rolesOf(p,w.n).map(k => ROLES[k]).join(', ')+'</td><td>'+(w.ts.length?w.ts.map(t => '<div class="row" style="margin:2px 0;cursor:pointer" data-act="open" data-tid="'+t.id+'"><b>'+t.id+'</b> '+esc(tpl(t.id).title)+' '+chip(t.status)+' <small class="'+(isOverdue(t)?'late':'')+'">due '+fmtDate(t.due)+'</small></div>').join(''):'<span class="muted">Nothing right now</span>')+'</td></tr>').join('')+'</table></div></div>';
}

function viewTickets(p){
  const f = ui.fstatus, w = ui.fwho;
  let ts = p.tickets.filter(t => f==='all' ? true : f==='Overdue' ? isOverdue(t) : t.status===f).filter(t => w==='all' ? true : t.assignee.includes(w));
  const body = PHASES.map((nm,i) => {
    const g = ts.filter(t => tpl(t.id).phase===i+1); if(!g.length) return '';
    return '<div class="group-title">'+(i+1)+'. '+nm+'</div><div class="card" style="padding:4px 8px"><table><tr><th>Ticket</th><th>Raised by</th><th>Assigned to</th><th>Due</th><th>Priority</th><th>Status</th></tr>'
      +g.map(t => { const tp = tpl(t.id); return '<tr class="click" data-act="open" data-tid="'+t.id+'"><td><b>'+t.id+'</b> '+esc(tp.title)+(tp.conditional?'<small>Only if the final SEO check finds issues</small>':'')+'</td><td>'+esc(ROLES[tp.from])+'</td><td>'+names(t.assignee)+'<small>'+esc(ROLES[tp.to])+'</small></td><td class="'+(isOverdue(t)?'late':'')+'">'+fmtDate(t.due)+'</td><td>'+esc(t.priority)+'</td><td>'+chip(t.status)+(isOverdue(t)?' <span class="chip s-overdue">Overdue</span>':'')+'</td></tr>'; }).join('')+'</table></div>';
  }).join('') || '<div class="card empty">No tickets match these filters.</div>';
  return '<div class="page"><div class="page-head"><div><h1>Tickets</h1><p>All 22 predefined tickets for '+esc(p.name)+'. Click a ticket to open it.</p></div>'
    +'<div class="row"><select data-change="fstatus"><option value="all">All statuses</option>'+STATUSES.map(s => '<option '+(f===s?'selected':'')+'>'+s+'</option>').join('')+'<option value="Overdue" '+(f==='Overdue'?'selected':'')+'>Overdue</option></select>'
    +'<select data-change="fwho"><option value="all">Everyone</option>'+members(p).map(n => '<option '+(w===n?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div></div>'+body+'</div>';
}

function viewPages(p){
  const rows = p.pages.map(g => '<tr><td><input data-change="pageEdit" data-pid="'+g.id+'" data-field="name" value="'+esc(g.name)+'"></td><td><input data-change="pageEdit" data-pid="'+g.id+'" data-field="url" value="'+esc(g.url)+'"></td><td>'+stageChip(g.content)+'</td><td>'+stageChip(g.design)+'</td><td>'+(g.home?'<span class="muted">T15</span>':stageChip(g.dev))+'</td><td><button class="btn sm danger" data-act="removePage" data-pid="'+g.id+'">Remove</button></td></tr>').join('');

    +'<div class="card"><table><tr><th>Page</th><th>URL</th><th>Content</th><th>Design</th><th>Development</th><th></th></tr>'+(rows||'<tr><td colspan="6" class="empty">No pages yet.</td></tr>')+'</table></div>'
    +'<form class="card" data-form="addPage" style="margin-top:16px"><h3>Add a page</h3><div class="grid2"><label class="field"><span>Page name</span><input name="name" placeholder="Pricing" required></label><label class="field"><span>URL</span><input name="url" placeholder="/pricing"></label></div><button class="btn primary">Add page</button></form></div>';
}

function viewReports(p){
  const ms = members(p);
  const work = ms.map(n => { const ts = p.tickets.filter(t => t.assignee.includes(n)); return '<tr><td><b>'+esc(n)+'</b><small>'+rolesOf(p,n).map(k => ROLES[k]).join(', ')+'</small></td><td>'+ts.filter(t => ACTIVE.includes(t.status)).length+'</td><td>'+ts.filter(t => t.status==='On Hold').length+'</td><td class="'+(ts.some(isOverdue)?'late':'')+'">'+ts.filter(isOverdue).length+'</td><td>'+ts.filter(t => t.status==='Closed').length+'</td></tr>'; }).join('');
  const delays = p.tickets.filter(t => isOverdue(t) || t.status==='On Hold').map(t => '<tr class="click" data-act="open" data-tid="'+t.id+'"><td><b>'+t.id+'</b> '+esc(tpl(t.id).title)+'</td><td>'+names(t.assignee)+'</td><td>'+chip(t.status)+'</td><td class="late">'+(t.due && t.due<todayISO()?daysBetween(t.due,todayISO())+' days':'—')+'</td><td>'+(t.hold?esc(t.hold.reason):esc(t.delayReason)||'<span class="late">No reason</span>')+'</td></tr>').join('');
  const stage = PHASES.map((nm,i) => { const ts = p.tickets.filter(t => tpl(t.id).phase===i+1 && t.closedAt && t.openedAt); const avg = ts.length ? (ts.reduce((s,t) => s+(t.closedAt-t.openedAt),0)/ts.length/86400000) : null; return '<tr><td>'+(i+1)+'. '+nm+'</td><td>'+ts.length+'</td><td>'+(avg===null?'—':avg.toFixed(1)+' days')+'</td></tr>'; }).join('');
  const rw = p.tickets.filter(t => t.returns>0).map(t => '<tr class="click" data-act="open" data-tid="'+t.id+'"><td><b>'+t.id+'</b> '+esc(tpl(t.id).title)+'</td><td>'+t.returns+'</td></tr>').join('');
  return '<div class="page"><div class="page-head"><div><h1>Reports</h1><p>Workload, delays, time per stage and rework for '+esc(p.name)+'.</p></div><button class="btn" data-act="exportCsv">Download CSV</button></div>'
    +'<div class="cols"><div class="card"><h3>Person workload</h3><table><tr><th>Person</th><th>Active</th><th>On hold</th><th>Overdue</th><th>Closed</th></tr>'+work+'</table></div>'
    +'<div class="card"><h3>Delay report</h3>'+(delays?'<table><tr><th>Ticket</th><th>Person</th><th>Status</th><th>Late</th><th>Reason</th></tr>'+delays+'</table>':'<div class="empty">No overdue or held tickets.</div>')+'</div></div>'
    +'<div class="cols" style="margin-top:16px"><div class="card"><h3>Time per phase</h3><table><tr><th>Phase</th><th>Closed tickets</th><th>Average open to close</th></tr>'+stage+'</table></div>'
    +'<div class="card"><h3>Rework report</h3>'+(rw?'<table><tr><th>Ticket</th><th>Times returned</th></tr>'+rw+'</table>':'<div class="empty">No ticket has been returned yet.</div>')+'</div></div></div>';
}

/* ---------- ticket drawer ---------- */
function pagesBlock(p,t,tp,mine){
  const cfg = PAGE_FLOW[t.id], act_ = ACTIVE.includes(t.status), qcAct = ['Open','In Progress'].includes(t.status);
  if(tp.kind==='pages'){
    return '<div class="sect"><h3>Page checklist</h3><table><tr><th>Page</th><th>Stage</th><th></th></tr>'+p.pages.map(g => '<tr><td>'+esc(g.name)+'<small>'+esc(g.url)+'</small>'+(g.note && g[cfg.field]===cfg.first?'<div class="note">Returned: '+esc(g.note)+'</div>':'')+'</td><td>'+stageChip(g[cfg.field])+'</td><td>'+(mine&&act_&&g[cfg.field]===cfg.first?'<button class="btn sm primary" data-act="pageSubmit" data-pid="'+g.id+'">Submit page</button>':'')+'</td></tr>').join('')+'</table></div>';
  }
  if(tp.kind==='pageqc'){
    return '<div class="sect"><h3>Pages</h3><table><tr><th>Page</th><th>Stage</th><th></th></tr>'+p.pages.map(g => '<tr><td>'+esc(g.name)+'<small>'+esc(g.url)+'</small></td><td>'+stageChip(g[cfg.field])+'</td><td>'+(mine&&qcAct&&g[cfg.field]===cfg.stage?'<div class="row"><button class="btn sm primary" data-act="pagePass" data-pid="'+g.id+'">Pass</button><button class="btn sm danger" data-act="pageReturn" data-pid="'+g.id+'">Return</button></div>':'')+'</td></tr>').join('')+'</table></div>';
  }
  if(tp.kind==='devpages'){
    return '<div class="sect"><h3>Pages to build</h3><table><tr><th>Page</th><th>Status</th><th></th></tr>'+p.pages.filter(g => !g.home).map(g => '<tr><td>'+esc(g.name)+'<small>'+esc(g.url)+'</small></td><td>'+stageChip(g.dev)+'</td><td>'+(mine&&act_?'<button class="btn sm" data-act="devPage" data-pid="'+g.id+'">'+(g.dev==='Built'?'Undo':'Mark built')+'</button>':'')+'</td></tr>').join('')+'</table>'
      +'<label class="check"><input type="checkbox" data-act="settings" '+(t.flags.settings?'checked':'')+' '+(mine&&act_?'':'disabled')+'> Website settings are configured</label></div>';
  }
  if(t.id==='T02'){
    return '<div class="sect"><h3>Page list from the SEO plan</h3>'+(p.pages.length?'<table><tr><th>Page</th><th>URL</th></tr>'+p.pages.map(g => '<tr><td>'+esc(g.name)+'</td><td>'+esc(g.url)+'</td></tr>').join('')+'</table>':'<div class="empty">No pages yet.</div>')+'<p class="muted">Edit the list in the <a href="#" data-act="nav" data-view="pages">Pages</a> view.</p></div>';
  }
  return '';
}

function drawer(p){
  const t = ui.drawer && ticket(p,ui.drawer); if(!t) return '';
  const tp = tpl(t.id), me = data.viewer;
  const mine = t.assignee.includes(me), inch = p.roles.incharge.includes(me);
  const btns = buttonsFor(p,t,me);
  const lastReturn = [...t.log].reverse().find(l => l.type==='return');
  const late = isOverdue(t);
  let banners = '';
  if(t.status==='Locked') banners += '<div class="banner info">🔒 '+esc(lockedReason(t))+'</div>';
  if(t.status==='Rework' && lastReturn) banners += '<div class="banner bad"><b>Returned by '+esc(lastReturn.who)+'</b><br>'+esc(lastReturn.text)+'</div>';
  if(t.status==='Rework' && tp.onReturn) banners += '<div class="banner warn">Waiting for the developer to finish '+tp.onReturn+'.</div>';
  if(t.status==='On Hold' && t.hold) banners += '<div class="banner warn"><b>On hold until '+fmtDate(t.hold.until)+'</b><br>'+esc(t.hold.reason)+'</div>';
  if(late || t.status==='On Hold') banners += '<div class="banner '+(late?'bad':'')+'"><b>'+(late?'This ticket is '+daysBetween(t.due,todayISO())+' days overdue.':'Delay reason')+'</b><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="delayTxt" placeholder="Why is this late or on hold?" value="'+esc(t.delayReason)+'" '+(mine||inch?'':'disabled')+'><button class="btn sm" data-act="delay" '+(mine||inch?'':'disabled')+'>Save reason</button></div></div>';
  const meta = '<dl class="meta"><div><dt>Raised by</dt><dd>'+names(p.roles[tp.from])+' <small>'+esc(ROLES[tp.from])+'</small></dd></div>'
    +'<div><dt>Assigned to</dt><dd>'+names(t.assignee)+' <small>'+esc(ROLES[tp.to])+'</small></dd></div>'
    +'<div><dt>Due date</dt><dd>'+(inch?'<div class="row" style="flex-wrap:nowrap"><input type="date" id="dueInput" value="'+esc(t.due)+'"><button class="btn sm" data-act="setDue">Save</button></div>':'<span class="'+(late?'late':'')+'">'+fmtDate(t.due)+'</span>')+'</dd></div>'
    +'<div><dt>Priority</dt><dd>'+(inch?'<select data-change="priority">'+['Low','Medium','High'].map(x => '<option '+(t.priority===x?'selected':'')+'>'+x+'</option>').join('')+'</select>':esc(t.priority))+'</dd></div></dl>';
  const checklist = t.checklist ? '<div class="sect"><h3>Launch checklist</h3>'+t.checklist.map((c,i) => '<label class="check"><input type="checkbox" data-act="checklist" data-i="'+i+'" '+(c.done?'checked':'')+(t.status==='Closed'?' disabled':'')+'> '+esc(c.label)+'</label>').join('')+'</div>' : '';
  const t01 = t.id==='T01' ? '<div class="sect"><h3>Deadlines</h3><p class="muted" style="margin-top:0">Project deadline: '+fmtDate(p.deadline)+'. '+p.tickets.filter(x => x.due).length+' of '+p.tickets.length+' tickets have a due date.</p>'+(inch?'<button class="btn" data-act="autoDeadlines">Auto-set deadlines</button>':'<small>Only the Incharge can set deadlines.</small>')+'</div>' : '';
  const attach = '<div class="sect"><h3>Attachments and links</h3>'+(t.attachments.length?t.attachments.map(a => '<div class="attach"><div>'+(a.url?'<a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.name)+'</a>':esc(a.name))+'<small>'+esc(a.who)+', '+fmtTime(a.at)+'</small></div><button class="btn sm ghost" data-act="detach" data-id="'+a.id+'">Remove</button></div>').join(''):'<div class="muted" style="padding-bottom:8px">Nothing attached.'+(t.id==='T02'?' The reference sheet is required.':'')+'</div>')
    +'<div class="row" style="flex-wrap:nowrap;margin-top:8px"><input id="attName" placeholder="Name, e.g. Reference sheet"><input id="attUrl" placeholder="Link (optional)"><button class="btn" data-act="attach">Add</button></div></div>';
  const log = [...t.log].reverse().map(l => '<div class="log '+l.type+'"><div class="av">'+esc((l.who||'?')[0])+'</div><div class="txt"><b>'+esc(l.who)+'</b> <small>'+fmtTime(l.at)+'</small><div>'+esc(l.text)+'</div></div></div>').join('') || '<div class="muted">No activity yet.</div>';
  const timeline = '<div class="sect"><h3>Comments and history</h3><textarea id="cmt" placeholder="Write a comment"></textarea><div class="row end" style="margin:8px 0 6px"><button class="btn primary" data-act="comment">Add comment</button></div>'+log+'</div>';
  return '<div class="overlay" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-label="Ticket '+t.id+'"><div class="drawer-head"><div><small>'+t.id+' · Phase '+tp.phase+', '+esc(PHASES[tp.phase-1])+'</small><h2>'+esc(tp.title)+'</h2><div class="row" style="margin-top:8px">'+chip(t.status)+(late?'<span class="chip s-overdue">Overdue</span>':'')+'</div></div><button class="btn ghost" data-act="closeDrawer" aria-label="Close">✕</button></div>'
    +'<div class="drawer-body">'+meta+'<div class="sect" style="margin-top:18px"><h3>Task</h3><p style="margin:0">'+esc(tp.task)+'</p></div>'+banners
    +(btns.length?'<div class="actions">'+btns.map(b => '<button class="btn '+(b.c||'')+'" data-act="'+b.a+'">'+esc(b.l)+'</button>').join('')+'</div>':'')
    +t01+pagesBlock(p,t,tp,mine)+checklist+attach+timeline+'</div></aside>';
}

function notifPanel(p){
  if(!ui.panel) return '';
  const mine = p.notifications.filter(n => n.to===data.viewer).slice(-15).reverse();
  return '<div class="panel"><div class="row" style="justify-content:space-between;padding:6px 10px"><b>Notifications</b><button class="btn sm ghost" data-act="readAll">Mark all read</button></div>'
    +(mine.length?mine.map(n => '<div class="it '+(n.read?'':'unread')+'" data-act="openNote" data-nid="'+n.id+'">'+esc(n.text)+'<br><small>'+fmtTime(n.at)+'</small></div>').join(''):'<div class="empty">No notifications for '+esc(data.viewer)+'.</div>')+'</div>';
}

/* ---------- shell and render ---------- */
function render(){
  const p = cur();
  if(!p && ui.view!=='projects' && ui.view!=='settings') ui.view = 'projects';
  if(p) fixViewer(p);
  const scroll = $('.drawer-body'), top = scroll ? scroll.scrollTop : 0;
  const nav = (v,l,i) => '<button class="nav '+(ui.view===v?'on':'')+'" data-act="nav" data-view="'+v+'"><span>'+i+'</span>'+l+'</button>';
  const unread = p ? p.notifications.filter(n => n.to===data.viewer && !n.read).length : 0;
  let view = '';
  if(ui.view==='dashboard' && p) view = viewDashboard(p);
  else if(ui.view==='tickets' && p) view = viewTickets(p);
  else if(ui.view==='pages' && p) view = viewPages(p);
  else if(ui.view==='reports' && p) view = viewReports(p);
  else if(ui.view==='settings') view = viewSettings();
  else view = viewProjects();
  $('#app').innerHTML = '<div class="app"><aside class="side"><div class="brand"><i></i>Pipeline</div>'
    +nav('dashboard','Dashboard','▦')+nav('tickets','Tickets','☰')+nav('pages','Pages','▤')+nav('reports','Reports','◔')+nav('projects','Projects','◆')+nav('settings','Data','⚙')
    +'<div class="side-foot" id="savedNote"></div></aside><main class="main"><header class="top">'
    +(p?'<label>Project <select data-change="project">'+data.projects.map(x => '<option value="'+x.id+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label>'
    +'<label>Viewing as <select data-change="viewer">'+members(p).map(n => '<option '+(n===data.viewer?'selected':'')+' value="'+esc(n)+'">'+esc(n)+' · '+rolesOf(p,n).map(k => ROLES[k]).join(', ')+'</option>').join('')+'</select></label>':'')
    +'<span class="grow"></span>'+(p?'<button class="btn bell" data-act="bell" aria-label="Notifications">🔔'+(unread?'<b>'+unread+'</b>':'')+'</button>':'')
    +'</header>'+(p?notifPanel(p):'')+view+'</main></div>'+(p?drawer(p):'');
  updateSaved();
  const nb = $('.drawer-body'); if(nb && scroll) nb.scrollTop = top;
}

/* ---------- events ---------- */
function exportCsv(p){
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows = [['Project','Ticket','Title','Phase','Raised by','Assigned to','Status','Due','Priority','Delay reason']].concat(p.tickets.map(t => { const tp = tpl(t.id); return [p.name,t.id,tp.title,PHASES[tp.phase-1],ROLES[tp.from],t.assignee.join('; '),t.status,t.due,t.priority,t.hold?t.hold.reason:t.delayReason]; }));
  download(p.name.replace(/\W+/g,'-')+'-tickets.csv',rows.map(r => r.map(q).join(',')).join('\n'),'text/csv');
}
function importData(text){
  const d = JSON.parse(text); check(d && Array.isArray(d.projects),'This file is not a pipeline data file.');
  data = d; if(!cur()) data.projectId = null; ui.drawer = null; save(); render(); toast('Data imported.');
}

document.addEventListener('click',async e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, p = cur(), tid = ui.drawer, pid = el.dataset.pid;
  if(el.tagName==='A') e.preventDefault();
  if(el.type==='checkbox') { /* handled below */ }
  try{
    switch(a){
      case 'nav': ui.view = el.dataset.view; ui.drawer = null; ui.panel = false; render(); break;
      case 'filter': ui.fstatus = el.dataset.status; ui.fwho = 'all'; ui.view = 'tickets'; render(); break;
      case 'open': ui.drawer = el.dataset.tid; ui.panel = false; render(); break;
      case 'closeDrawer': ui.drawer = null; render(); break;
      case 'bell': ui.panel = !ui.panel; render(); break;
      case 'readAll': p.notifications.forEach(n => { if(n.to===data.viewer) n.read = true; }); save(); render(); break;
      case 'openNote': { const n = p.notifications.find(x => x.id===el.dataset.nid); if(n){ n.read = true; if(n.tid) ui.drawer = n.tid; ui.panel = false; save(); render(); } break; }
      case 'start': case 'complete': case 'resume': case 'resubmit': run(a,tid); break;
      case 'submit': ask('Submit for review',[{name:'comment',label:'Note for the reviewer (optional)',type:'textarea'}],'Submit',v => run('submit',tid,{comment:v.comment})); break;
      case 'approve': ask('Approve',[{name:'comment',label:'Comment (optional)',type:'textarea'}],'Approve',v => run('approve',tid,{comment:v.comment})); break;
      case 'return': ask('Return with reason',[{name:'reason',label:'What needs to change? Name the page and the problem.',type:'textarea',required:true}],'Return',v => run('return',tid,{reason:v.reason})); break;
      case 'hold': ask('Put on hold',[{name:'reason',label:'Reason',type:'textarea',required:true},{name:'until',label:'Expected date',type:'date',required:true,value:addDays(todayISO(),3)}],'Put on hold',v => run('hold',tid,v)); break;
      case 'reassign': ask('Reassign ticket',[{name:'to',label:'New assignee',type:'select',options:members(p)},{name:'comment',label:'Comment (required)',type:'textarea',required:true}],'Reassign',v => run('reassign',tid,v)); break;
      case 'reopen': ask('Reopen ticket',[{name:'reason',label:'Reason',type:'textarea',required:true}],'Reopen',v => run('reopen',tid,v)); break;
      case 'setDue': {
        const date = $('#dueInput').value, t = ticket(p,tid);
        if(t.due) ask('Change deadline',[{name:'comment',label:'Reason for the change',type:'textarea',required:true}],'Change',v => run('setDue',tid,{date:date,comment:v.comment}));
        else run('setDue',tid,{date:date}); break; }
      case 'comment': run('comment',tid,{text:$('#cmt').value}); break;
      case 'attach': run('attach',tid,{name:$('#attName').value,url:$('#attUrl').value}); break;
      case 'detach': run('detach',tid,{id:el.dataset.id}); break;
      case 'delay': run('delay',tid,{text:$('#delayTxt').value}); break;
      case 'checklist': run('checklist',tid,{index:Number(el.dataset.i)}); break;
      case 'settings': run('settings',tid); break;
      case 'pageSubmit': run('pageSubmit',tid,{pageId:pid}); break;
      case 'pagePass': run('pagePass',tid,{pageId:pid}); break;
      case 'pageReturn': ask('Return page',[{name:'reason',label:'What needs to change?',type:'textarea',required:true}],'Return page',v => run('pageReturn',tid,{pageId:pid,reason:v.reason})); break;
      case 'devPage': run('devPage',tid,{pageId:pid}); break;
      case 'autoDeadlines': run('autoDeadlines',tid); break;
      case 'removePage': if(confirm('Remove this page from the project?')) run('removePage',null,{pageId:pid}); break;
      case 'switchProject': data.projectId = pid; ui.view = 'dashboard'; ui.drawer = null; save(); render(); break;
      case 'deleteProject': if(confirm('Delete this project and all its tickets?')){ data.projects = data.projects.filter(x => x.id!==pid); data.projectId = data.projects[0] ? data.projects[0].id : null; ui.drawer = null; save(); render(); } break;
      case 'fillSample': { const f = $('[data-form="newProject"]'); const s = {name:'New Website',seo:'Asha',writer:'Ravi, Meena',qc:'Karthik',designer:'Divya',developer:'Arun',incharge:'Suresh'}; Object.keys(s).forEach(k => { f.elements[k].value = s[k]; }); break; }
      case 'exportCsv': exportCsv(p); break;
      case 'exportJson': download('pipeline-data.json',JSON.stringify(data,null,2),'application/json'); break;
      case 'importJson': $('#importFile').click(); break;
      case 'connectFile':
        check(window.showSaveFilePicker,'Your browser cannot save to a chosen file. Use Export JSON instead.');
        fileHandle = await window.showSaveFilePicker({suggestedName:'pipeline-data.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
        await writeFile(); toast('Linked. Every change now saves to that file.'); render(); break;
      case 'openFile': {
        check(window.showOpenFilePicker,'Your browser cannot open a file this way. Use Import JSON instead.');
        const hs = await window.showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}]});
        const txt = await (await hs[0].getFile()).text(); importData(txt); fileHandle = hs[0]; render(); break; }
      case 'reset': if(confirm('Replace everything with the sample project?')){ data = seed(); ui.drawer = null; ui.view = 'dashboard'; save(); render(); } break;
      case 'clearAll': if(confirm('Delete all projects and tickets?')){ data = {projects:[],projectId:null,viewer:''}; ui.drawer = null; ui.view = 'projects'; save(); render(); } break;
    }
  }catch(err){ if(err && err.name!=='AbortError') toast(err.message,'error'); }
});

document.addEventListener('change',e => {
  const el = e.target, k = el.dataset && el.dataset.change, p = cur();
  if(el.dataset && el.dataset.act==='checklist') return;
  if(el.type==='checkbox' && el.dataset.act==='settings') return;
  if(el.id==='importFile'){ const f = el.files[0]; if(f){ f.text().then(importData).catch(err => toast(err.message,'error')); } el.value = ''; return; }
  if(!k) return;
  if(k==='project'){ data.projectId = el.value; ui.drawer = null; save(); render(); }
  else if(k==='viewer'){ data.viewer = el.value; save(); render(); }
  else if(k==='fstatus'){ ui.fstatus = el.value; render(); }
  else if(k==='fwho'){ ui.fwho = el.value; render(); }
  else if(k==='priority') run('setPriority',ui.drawer,{priority:el.value});
  else if(k==='pageEdit') run('editPage',null,{pageId:el.dataset.pid,field:el.dataset.field,value:el.value});
});

document.addEventListener('submit',e => {
  const f = e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  try{
    if(f.dataset.form==='newProject'){ const np = createProject(v); autoDeadlines(np,np.roles.incharge[0]); data.projects.push(np); data.projectId = np.id; data.viewer = np.roles.incharge[0]; ui.view = 'dashboard'; save(); render(); toast('Project created with 22 tickets.'); }
    if(f.dataset.form==='addPage'){ run('addPage',null,v); }
  }catch(err){ toast(err.message,'error'); }
});

document.addEventListener('keydown',e => { if(e.key==='Escape' && ui.drawer && !$('#modal').open){ ui.drawer = null; render(); } });

/* a small hook so the prototype can be tested from the console or a script */
window.__pipeline = {get data(){return data;},act:(...a)=>{ act(cur(),...a); save(); render(); },cur:cur,ui:ui,render:render,engine:{act,createProject,autoDeadlines,refresh,progress,ticket,tpl,TEMPLATES,members}};

render();
})();
</script>
</body>
</html>
